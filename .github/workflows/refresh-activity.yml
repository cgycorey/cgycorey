name: refresh activity
on:
  schedule:
    - cron: "0 6 */2 * *"  # every 2 days at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate activity.svg
        run: python3 scripts/gen_activity.py

      - name: Commit and push
        run: |
          git config user.name "cgycorey"
          git config user.email "4724788+cgycorey@users.noreply.github.com"
          git add activity.svg
          if git diff --cached --quiet; then
            echo "no change — activity.svg is current"
          else
            git commit -m "activity: refresh contribution heatmap"
            git push
          fi